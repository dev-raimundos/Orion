services:
  api:
    image: api
    build:
      context: .
      dockerfile: src/Api/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DatabaseConnection=${DATABASE_CONNECTION_STRING}
      - Jwt__Issuer=${JWT_ISSUER:-Orion}
      - Jwt__Audience=${JWT_AUDIENCE:-Orion.Clients}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES:-15}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
    expose:
      - "8080"
    networks:
      dokploy-network:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  dokploy-network:
    name: dokploy-network
    external: true
