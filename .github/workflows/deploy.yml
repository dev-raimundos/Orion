name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Orion.slnx

      - name: Build
        run: dotnet build Orion.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Orion.slnx --no-build -c Release

  # Não builda nem publica imagem aqui — o app "Compose" no Dokploy já está
  # ligado ao repo via GitHub App e cuida de clonar/buildar sozinho. Este job
  # só avisa o Dokploy "pode deployar agora", depois que os testes passaram.
  #
  # Migration não roda aqui de propósito: um runner do GitHub (mesmo
  # self-hosted) é um risco real de execução de código nesse repositório,
  # que é público — quem migra é a própria app, no próprio startup, dentro
  # da rede on-premise (ver RUN_MIGRATIONS no Program.cs/docker-compose.yml).
  #
  # Pré-requisito: desligue o toggle "Auto Deploy" da aplicação no painel do
  # Dokploy. Senão o Dokploy tenta deployar direto no push (via GitHub App),
  # em paralelo com este workflow, e código com teste quebrado poderia subir
  # antes desse job barrar.
  # A URL do secret DOKPLOY_WEBHOOK_URL já É a credencial (não tem x-api-key
  # separado) — qualquer um com ela dispara deploy. Por isso vive só como
  # secret, nunca aparece hardcoded aqui nem em nenhum arquivo commitado.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Dokploy
        run: curl --fail -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
