name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Aplicar as migrations do EF Core neste deploy?"
        type: boolean
        default: true

env:
  DOTNET_VERSION: "10.0.x"
  # Mesmo nome de imagem que docker-compose.yml/docker-compose.prod.yml esperam
  # via "${DOCKER_REGISTRY-}api" — só muda o registry na frente.
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Orion.slnx

      - name: Build
        run: dotnet build Orion.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Orion.slnx --no-build -c Release

  # Aplica as migrations pendentes de cada módulo contra o banco de produção.
  # Assume migrations aditivas (CreateTable/AddColumn) — código antigo rodando
  # contra schema novo não quebra. Migration destrutiva (DROP/rename) precisa
  # de estratégia diferente (ex.: expand-and-contract em duas releases).
  #
  # Controlado por uma variável true/false, não hardcoded:
  # - push em main: usa a variável de repositório/ambiente "RUN_MIGRATIONS"
  #   (Settings → Secrets and variables → Actions → Variables). Ausente = não roda.
  # - workflow_dispatch manual: usa o input "run_migrations" do próprio disparo,
  #   sobrepondo a variável do repositório pra aquela execução.
  migrate:
    needs: test
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_migrations == true) ||
      (github.event_name != 'workflow_dispatch' && vars.RUN_MIGRATIONS == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply Users module migrations
        run: >
          dotnet ef database update
          --project src/Modules/Users/Users.csproj
          --startup-project src/Api/Api.csproj
        env:
          ConnectionStrings__DatabaseConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
          Jwt__SigningKey: ${{ secrets.JWT_SIGNING_KEY }}

      - name: Apply Authentication module migrations
        run: >
          dotnet ef database update
          --project src/Modules/Authentication/Authentication.csproj
          --startup-project src/Api/Api.csproj
          --context AuthenticationDbContext
        env:
          ConnectionStrings__DatabaseConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
          Jwt__SigningKey: ${{ secrets.JWT_SIGNING_KEY }}

  # "needs: migrate" sozinho pularia este job em cascata quando migrate for
  # pulado por causa do "if:" acima — o "if:" abaixo trata skip como sucesso.
  build-and-push:
    needs: [test, migrate]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}api:latest
            ${{ env.DOCKER_REGISTRY }}api:${{ github.sha }}

  # PLACEHOLDER: assume um host Docker acessível via SSH com o repo (docker-compose*.yml)
  # já clonado em /opt/orion e um ".env" de produção configurado lá (ver .env.production.example).
  # Se o destino real for Azure/AWS/Kubernetes, troque este job pela action específica
  # do provedor (ex.: azure/webapps-deploy, aws-actions/*, etc).
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/orion
            export DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
            export TAG=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
