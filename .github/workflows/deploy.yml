name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Aplicar as migrations do EF Core neste deploy?"
        type: boolean
        default: false

env:
  DOTNET_VERSION: "10.0.x"
  # Mesmo nome de imagem que docker-compose.yml/docker-compose.prod.yml esperam
  # via "${DOCKER_REGISTRY-}api" — só muda o registry na frente.
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}/

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Orion.slnx

      - name: Build
        run: dotnet build Orion.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Orion.slnx --no-build -c Release

  # Migration não roda aqui: um runner do GitHub na nuvem não alcançaria um SQL
  # Server on-premise sem exposição pra internet. A própria aplicação aplica as
  # migrations pendentes no startup, controlada pela env var RUN_MIGRATIONS
  # (ver Program.cs e docker-compose.prod.yml) — o job "deploy" abaixo só liga
  # essa variável, quem roda a migration de fato é o container já dentro da rede.
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}api:latest
            ${{ env.DOCKER_REGISTRY }}api:${{ github.sha }}

  # Assume um host Docker on-premise acessível via SSH, com o repo (docker-compose*.yml)
  # já clonado em /opt/orion e um ".env" de produção configurado lá (ver .env.production.example).
  # Ajuste o "cd" se o caminho no seu servidor for outro.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/orion
            export DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}
            export TAG=${{ github.sha }}
            export RUN_MIGRATIONS=${{ (github.event_name == 'workflow_dispatch' && inputs.run_migrations == true) || (github.event_name != 'workflow_dispatch' && vars.RUN_MIGRATIONS == 'true') }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
