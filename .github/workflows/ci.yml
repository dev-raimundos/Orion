name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Orion.slnx

      - name: Build
        run: dotnet build Orion.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Orion.slnx --no-build -c Release

  # Só dispara em push na main (não em pull_request) e só depois que os
  # testes passarem. A URL do secret DOKPLOY_WEBHOOK_URL já É a credencial
  # (sem x-api-key separado) — por isso vive só como secret, nunca aparece
  # hardcoded aqui nem em nenhum arquivo committado.
  #
  # Pré-requisito: desligue o toggle "Auto Deploy" da aplicação no painel do
  # Dokploy. Senão o Dokploy tenta deployar direto no push (via GitHub App),
  # em paralelo a este job, e código com teste quebrado poderia subir antes
  # dele barrar.
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # O webhook do Dokploy não é um endpoint genérico: ele espera um payload
      # no formato de um webhook real do GitHub (header X-GitHub-Event: push +
      # body com "ref" e "repository.full_name") pra saber de qual branch veio
      # e comparar com a branch configurada na aplicação. Sem isso ele responde
      # 200 com {"message":"Branch Not Match"} e não deploya nada.
      - name: Disparar deploy no Dokploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          REF: ${{ github.ref }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          curl --fail -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\":\"$REF\",\"repository\":{\"full_name\":\"$REPO_FULL_NAME\"}}"
