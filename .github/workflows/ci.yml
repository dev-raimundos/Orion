name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Orion.slnx

      - name: Build
        run: dotnet build Orion.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Orion.slnx --no-build -c Release
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar deploy no Dokploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
          REF: ${{ github.ref }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          curl --fail -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d "{\"ref\":\"$REF\",\"repository\":{\"full_name\":\"$REPO_FULL_NAME\"}}"
